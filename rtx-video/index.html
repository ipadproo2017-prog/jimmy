<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #04060a; font-family: "Arial Black", "Arial", sans-serif;
      }
      :root {
        --neon: #00e5ff; --neon2: #7a3cff; --accent: #ff1f4b; --txt: #e7f1ff;
      }

      /* ---------- Background ---------- */
      #bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(circle at 50% 38%, #0b1626 0%, #050810 55%, #02040a 100%);
      }
      #grid {
        position: absolute; inset: -10%;
        background-image:
          linear-gradient(rgba(0,229,255,.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0,229,255,.06) 1px, transparent 1px);
        background-size: 60px 60px;
        -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 25%, transparent 80%);
        mask-image: radial-gradient(circle at 50% 45%, #000 25%, transparent 80%);
        transform: perspective(900px) rotateX(58deg) translateY(120px) scale(1.6);
      }
      #vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(circle at 50% 45%, transparent 45%, rgba(0,0,0,.75) 100%);
      }
      .particle {
        position: absolute; width: 4px; height: 4px; border-radius: 50%;
        background: var(--neon); box-shadow: 0 0 8px var(--neon); opacity: .6;
      }

      /* ---------- Scene wrappers ---------- */
      .scene {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center;
      }

      /* ---------- Brand intro ---------- */
      #brandWrap { gap: 24px; }
      .brand {
        font-family: "Arial Black", sans-serif; font-weight: 900;
        letter-spacing: .14em; font-size: 96px;
      }
      .brand .msi { color: var(--accent); text-shadow: 0 0 40px rgba(255,31,75,.6); }
      .brand .sep { color: #46566e; margin: 0 24px; }
      .brand .trio { color: #fff; }
      .brand-line {
        width: 0; height: 3px; background: linear-gradient(90deg, var(--neon), var(--neon2));
        box-shadow: 0 0 24px var(--neon);
      }
      .brand-sub {
        font-size: 26px; letter-spacing: .5em; color: var(--neon); font-weight: 700;
        text-shadow: 0 0 24px rgba(0,229,255,.5);
      }

      /* ---------- Title ---------- */
      #titleWrap { gap: 0; }
      .kicker {
        font-size: 30px; letter-spacing: .65em; color: var(--neon); font-weight: 700;
        margin-bottom: 30px; text-shadow: 0 0 24px rgba(0,229,255,.6);
      }
      .rtx {
        font-family: "Arial Black", sans-serif; font-weight: 900;
        font-size: 220px; line-height: .84; letter-spacing: -.02em; color: #fff;
      }
      .num {
        font-family: "Arial Black", sans-serif; font-weight: 900;
        font-size: 340px; line-height: .82; letter-spacing: -.02em; color: #fff;
        text-shadow: 0 0 10px #fff, 0 0 50px var(--neon), 0 0 110px var(--neon2);
      }
      .title-sub {
        margin-top: 28px; font-size: 34px; letter-spacing: .28em; color: var(--txt);
        font-weight: 700;
      }

      /* ---------- GPU card ---------- */
      #gpuWrap { gap: 0; }
      .gpu {
        position: relative; width: 1180px; height: 470px;
        border-radius: 22px;
        background:
          linear-gradient(135deg, #12161e 0%, #0a0d13 45%, #14181f 100%);
        box-shadow:
          0 40px 120px rgba(0,0,0,.7),
          inset 0 2px 0 rgba(255,255,255,.06),
          inset 0 -30px 60px rgba(0,0,0,.6);
        border: 1px solid rgba(120,140,170,.18);
        display: flex; align-items: center; justify-content: center; gap: 26px;
      }
      /* top RGB strip */
      .rgb-strip {
        position: absolute; top: -7px; left: 5%; width: 90%; height: 7px;
        border-radius: 6px;
        background: linear-gradient(90deg,#ff1f4b,#ffae00,#00e5ff,#7a3cff,#ff1f4b);
        filter: saturate(1.6) brightness(1.3);
        box-shadow: 0 0 26px rgba(0,229,255,.8), 0 0 60px rgba(122,60,255,.5);
      }
      /* fans */
      .fan {
        position: relative; width: 320px; height: 320px; border-radius: 50%;
        background: radial-gradient(circle at 50% 45%, #1a212c 0%, #0a0d12 70%);
        box-shadow: inset 0 0 40px rgba(0,0,0,.8), inset 0 0 0 6px #2a3340,
                    0 0 0 2px rgba(0,229,255,.12);
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
      }
      .blades {
        position: absolute; width: 290px; height: 290px; border-radius: 50%;
        background: repeating-conic-gradient(
          from 0deg,
          #2c3543 0deg 10deg,
          #161b24 10deg 20deg,
          #0d1117 20deg 30deg
        );
        -webkit-mask-image: radial-gradient(circle, #000 30%, #000 66%, transparent 70%);
        mask-image: radial-gradient(circle, #000 30%, #000 66%, transparent 70%);
        box-shadow: inset 0 0 30px rgba(0,0,0,.6);
      }
      .hub {
        position: relative; z-index: 2; width: 96px; height: 96px; border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, #2a3240, #0c0f15 75%);
        box-shadow: inset 0 0 14px rgba(0,0,0,.8), 0 0 4px rgba(0,0,0,.6);
        display: flex; align-items: center; justify-content: center;
      }
      .hub-glow {
        width: 40px; height: 40px; border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 26px var(--accent), 0 0 50px rgba(255,31,75,.6);
      }
      .fan-ring {
        position: absolute; inset: 8px; border-radius: 50%;
        border: 2px solid rgba(0,229,255,.18);
      }
      /* side glow bar */
      .side-glow {
        position: absolute; right: -6px; top: 22%; width: 6px; height: 56%;
        border-radius: 5px; background: var(--neon2);
        box-shadow: 0 0 24px var(--neon2), 0 0 50px rgba(122,60,255,.6);
      }

      /* stats row */
      #statRow {
        display: flex; gap: 60px; margin-top: 70px;
      }
      .stat { text-align: left; border-left: 3px solid var(--neon); padding-left: 18px; }
      .stat-num {
        font-family: "Arial Black", sans-serif; font-weight: 900; font-size: 64px;
        color: #fff; text-shadow: 0 0 26px rgba(0,229,255,.45);
      }
      .stat-label {
        font-size: 22px; letter-spacing: .18em; color: #8aa0bd; margin-top: 4px;
        text-transform: uppercase; font-weight: 700;
      }

      /* ---------- CTA ---------- */
      #ctaWrap { gap: 36px; }
      .cta-title {
        font-family: "Arial Black", sans-serif; font-weight: 900; font-size: 150px;
        line-height: .95; color: #fff;
      }
      .cta-title .hl {
        color: var(--neon);
        text-shadow: 0 0 14px #fff, 0 0 50px var(--neon), 0 0 100px var(--neon2);
      }
      .cta-sub { font-size: 30px; letter-spacing: .2em; color: #8aa0bd; font-weight: 700; text-transform: uppercase; }
      .cta-btn {
        font-family: "Arial Black", sans-serif; font-weight: 900; letter-spacing: .18em;
        font-size: 38px; color: #02040a; padding: 28px 90px; border-radius: 999px;
        background: linear-gradient(120deg, var(--neon), var(--neon2));
        box-shadow: 0 0 60px rgba(0,229,255,.6), 0 20px 60px rgba(122,60,255,.5);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="18"
      data-width="1920"
      data-height="1080"
    >
      <!-- Background (whole video) -->
      <div id="bg" class="clip" data-start="0" data-duration="18" data-track-index="0">
        <div id="grid"></div>
        <div id="particles"></div>
        <div id="vignette"></div>
      </div>

      <!-- Scene 1: Brand intro -->
      <div id="brandWrap" class="scene clip" data-start="0" data-duration="4" data-track-index="1">
        <div class="brand">
          <span class="msi">MSI</span><span class="sep">/</span><span class="trio">GAMING&nbsp;TRIO</span>
        </div>
        <div class="brand-line" id="brandLine"></div>
        <div class="brand-sub">ARCHITECTURE&nbsp;BLACKWELL</div>
      </div>

      <!-- Scene 2: Title -->
      <div id="titleWrap" class="scene clip" data-start="3.6" data-duration="4.4" data-track-index="2">
        <div class="kicker" id="kicker">GEFORCE&nbsp;·&nbsp;NEXT&nbsp;GEN</div>
        <div class="rtx" id="rtxWord">RTX</div>
        <div class="num" id="numWord">5090</div>
        <div class="title-sub" id="titleSub">32&nbsp;Go&nbsp;GDDR7&nbsp;·&nbsp;GAMING&nbsp;TRIO&nbsp;OC</div>
      </div>

      <!-- Scene 3: GPU + stats -->
      <div id="gpuWrap" class="scene clip" data-start="7.6" data-duration="6.4" data-track-index="3">
        <div class="gpu" id="gpuCard">
          <div class="rgb-strip" id="rgbStrip"></div>
          <div class="side-glow" id="sideGlow"></div>
          <div class="fan"><div class="blades fanblade"></div><div class="fan-ring"></div><div class="hub"><div class="hub-glow"></div></div></div>
          <div class="fan"><div class="blades fanblade"></div><div class="fan-ring"></div><div class="hub"><div class="hub-glow"></div></div></div>
          <div class="fan"><div class="blades fanblade"></div><div class="fan-ring"></div><div class="hub"><div class="hub-glow"></div></div></div>
        </div>
        <div id="statRow">
          <div class="stat"><div class="stat-num" data-to="32" data-suffix=" Go">0</div><div class="stat-label">GDDR7</div></div>
          <div class="stat"><div class="stat-num" data-to="21760" data-suffix="">0</div><div class="stat-label">Cœurs CUDA</div></div>
          <div class="stat"><div class="stat-num" data-to="512" data-suffix="-bit">0</div><div class="stat-label">Bus mémoire</div></div>
          <div class="stat"><div class="stat-num" data-to="240" data-suffix=" Hz+">0</div><div class="stat-label">4K Gaming</div></div>
        </div>
      </div>

      <!-- Scene 4: CTA -->
      <div id="ctaWrap" class="scene clip" data-start="13.6" data-duration="4.4" data-track-index="4">
        <div class="cta-title" id="ctaTitle">PRÊT À <span class="hl">DOMINER&nbsp;?</span></div>
        <div class="cta-sub" id="ctaSub">MSI GeForce RTX 5090 32G Gaming Trio OC</div>
        <div class="cta-btn" id="ctaBtn">PRÉCOMMANDER</div>
      </div>
    </div>

    <script>
      // ---- deterministic particles (seeded, no Math.random) ----
      (function () {
        const host = document.getElementById("particles");
        const N = 70;
        let s = 1337;
        const rnd = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
        for (let i = 0; i < N; i++) {
          const p = document.createElement("div");
          p.className = "particle";
          p.style.left = (rnd() * 1920) + "px";
          p.style.top = (rnd() * 1080) + "px";
          const sc = 0.4 + rnd() * 1.6;
          p.style.transform = "scale(" + sc + ")";
          p.style.opacity = 0.25 + rnd() * 0.5;
          host.appendChild(p);
        }
      })();

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const TOTAL = 18;
      const reps = (cycle) => Math.max(0, Math.floor(TOTAL / cycle) - 1);

      // ===== Continuous, deterministic loops (whole timeline) =====
      // particles slow drift
      gsap.utils.toArray(".particle").forEach((p, i) => {
        tl.to(p, { y: "-=40", duration: 6, repeat: reps(6), yoyo: true, ease: "sine.inOut" }, 0);
      });

      // ===== Scene 1: brand (t=0) =====
      tl.from("#brandWrap .brand", { opacity: 0, y: 40, duration: 0.9, ease: "power3.out" }, 0.1);
      tl.fromTo("#brandLine", { width: 0 }, { width: 520, duration: 0.8, ease: "power2.out" }, 0.7);
      tl.from("#brandWrap .brand-sub", { opacity: 0, letterSpacing: "1em", duration: 0.9, ease: "power2.out" }, 0.9);
      tl.to("#brandWrap", { opacity: 0, scale: 1.08, duration: 0.5, ease: "power2.in" }, 3.5);

      // ===== Scene 2: title (t=3.6) =====
      tl.from("#kicker", { opacity: 0, y: 20, duration: 0.6 }, 3.7);
      tl.from("#rtxWord", { opacity: 0, x: -120, duration: 0.7, ease: "power4.out" }, 3.8);
      tl.fromTo("#numWord",
        { opacity: 0, scale: 1.6, filter: "blur(20px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.8, ease: "power4.out" }, 4.0);
      tl.from("#titleSub", { opacity: 0, y: 24, duration: 0.7 }, 4.6);
      // pulsing glow on the number
      tl.to("#numWord", { textShadow: "0 0 16px #fff, 0 0 80px #00e5ff, 0 0 160px #7a3cff",
        duration: 0.9, repeat: 3, yoyo: true, ease: "sine.inOut" }, 4.8);
      tl.to("#titleWrap", { opacity: 0, scale: 0.96, duration: 0.5, ease: "power2.in" }, 7.5);

      // ===== Scene 3: GPU (t=7.6) =====
      tl.from("#gpuCard", { opacity: 0, y: 120, rotationX: 35, transformPerspective: 1200, duration: 1.0, ease: "power3.out" }, 7.7);
      tl.from(".side-glow, .rgb-strip", { opacity: 0, duration: 0.8 }, 8.2);
      // fans spin (deterministic under seek)
      tl.to(".fanblade", { rotation: 360, duration: 1.1, repeat: reps(1.1), ease: "none" }, 0);
      // RGB strip hue cycle
      tl.to("#rgbStrip", { filter: "saturate(1.6) brightness(1.3) hue-rotate(360deg)",
        duration: 5, repeat: reps(5), ease: "none" }, 0);
      tl.to("#sideGlow", { filter: "hue-rotate(360deg)", duration: 5, repeat: reps(5), ease: "none" }, 0);
      // stats reveal + count up
      gsap.utils.toArray("#statRow .stat").forEach((st, i) => {
        tl.from(st, { opacity: 0, y: 30, duration: 0.5, ease: "power2.out" }, 8.6 + i * 0.18);
      });
      gsap.utils.toArray("#statRow .stat-num").forEach((el) => {
        const to = parseFloat(el.dataset.to);
        const suffix = el.dataset.suffix || "";
        const obj = { v: 0 };
        tl.to(obj, {
          v: to, duration: 1.4, ease: "power2.out",
          onUpdate: () => { el.textContent = Math.round(obj.v).toLocaleString("fr-FR") + suffix; }
        }, 8.9);
      });
      tl.to("#gpuWrap", { opacity: 0, scale: 0.97, duration: 0.5, ease: "power2.in" }, 13.5);

      // ===== Scene 4: CTA (t=13.6) =====
      tl.from("#ctaTitle", { opacity: 0, scale: 1.3, duration: 0.8, ease: "power4.out" }, 13.7);
      tl.from("#ctaSub", { opacity: 0, y: 20, duration: 0.6 }, 14.2);
      tl.from("#ctaBtn", { opacity: 0, y: 30, duration: 0.6, ease: "back.out(2)" }, 14.5);
      tl.to("#ctaBtn", { boxShadow: "0 0 100px rgba(0,229,255,.9), 0 20px 80px rgba(122,60,255,.8)",
        scale: 1.04, duration: 0.8, repeat: 3, yoyo: true, ease: "sine.inOut" }, 15.0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
