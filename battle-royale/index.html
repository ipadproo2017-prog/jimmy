<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STORM ROYALE — Mini Battle Royale</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0a0e14; overflow: hidden;
    font-family: "Trebuchet MS", system-ui, sans-serif; color: #e7f1ff; }
  #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; }

  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(circle at 50% 40%, rgba(20,30,50,.85), rgba(4,6,10,.96));
    z-index: 10; gap: 18px; padding: 24px;
  }
  .hidden { display: none !important; }
  h1 { font-size: clamp(40px, 9vw, 92px); letter-spacing: .06em; font-weight: 900;
    background: linear-gradient(120deg, #43e5ff, #7a5cff, #ff4fa3);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(80,140,255,.3); }
  h2 { font-size: clamp(28px, 6vw, 56px); font-weight: 900; }
  .win { color: #5dffa0; } .lose { color: #ff5d6c; }
  p.sub { color: #9fb3d1; font-size: clamp(14px, 2.4vw, 19px); max-width: 540px; line-height: 1.5; }
  .keys { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; margin: 6px 0 4px; }
  .key { background: rgba(255,255,255,.06); border: 1px solid rgba(120,160,220,.25);
    border-radius: 10px; padding: 10px 16px; font-size: 14px; color: #cfe0f7; }
  .key b { color: #fff; }
  button {
    margin-top: 8px; font-family: inherit; font-weight: 900; font-size: 20px; letter-spacing: .08em;
    color: #03121a; padding: 16px 50px; border: none; border-radius: 999px; cursor: pointer;
    background: linear-gradient(120deg, #43e5ff, #7a5cff);
    box-shadow: 0 0 40px rgba(67,229,255,.5), 0 12px 30px rgba(122,92,255,.4);
    transition: transform .15s, box-shadow .15s;
  }
  button:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 0 60px rgba(67,229,255,.7); }
  .stat-line { font-size: 15px; color: #9fb3d1; }
  .stat-line b { color: #fff; font-size: 18px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- Start screen -->
<div class="overlay" id="startScreen">
  <h1>STORM ROYALE</h1>
  <p class="sub">Tu es parachuté avec <b>25 adversaires</b>. Récupère des armes, survis à la tempête qui rétrécit, et sois le <b>dernier en vie</b>.</p>
  <div class="keys">
    <div class="key"><b>ZQSD / WASD</b> — se déplacer</div>
    <div class="key"><b>Souris</b> — viser</div>
    <div class="key"><b>Clic / Espace</b> — tirer</div>
    <div class="key"><b>Marcher sur une caisse</b> — ramasser l'arme</div>
  </div>
  <button id="startBtn">DÉPLOIEMENT</button>
</div>

<!-- End screen -->
<div class="overlay hidden" id="endScreen">
  <h2 id="endTitle"></h2>
  <p class="stat-line">Éliminations : <b id="endKills">0</b></p>
  <p class="stat-line">Classement : <b id="endRank">#--</b> / 26</p>
  <p class="stat-line">Temps survécu : <b id="endTime">0s</b></p>
  <button id="restartBtn">REJOUER</button>
</div>

<script>
"use strict";
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
let W = 0, H = 0;
function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener("resize", resize); resize();

// ---------- World ----------
const WORLD = 4000;            // square world size
const TOTAL_PLAYERS = 26;      // you + 25 bots

// ---------- Weapons ----------
const WEAPONS = {
  fists:   { name: "Poings",     dmg: 8,  rof: 380, spread: 0.05, speed: 9,  range: 60,  pellets: 1, ammo: Infinity, color: "#cfd6e0", auto: true },
  pistol:  { name: "Pistolet",   dmg: 18, rof: 320, spread: 0.04, speed: 13, range: 620, pellets: 1, ammo: 60,  color: "#9be7ff", auto: false },
  smg:     { name: "SMG",        dmg: 11, rof: 95,  spread: 0.10, speed: 14, range: 560, pellets: 1, ammo: 180, color: "#b6ff9b", auto: true },
  shotgun: { name: "Fusil à pompe", dmg: 9, rof: 700, spread: 0.22, speed: 12, range: 360, pellets: 8, ammo: 32, color: "#ffd36b", auto: false },
  rifle:   { name: "Fusil d'assaut", dmg: 26, rof: 150, spread: 0.045, speed: 17, range: 820, pellets: 1, ammo: 120, color: "#ff9be7", auto: true },
  sniper:  { name: "Sniper",     dmg: 85, rof: 1100, spread: 0.005, speed: 26, range: 1300, pellets: 1, ammo: 18, color: "#ff6b6b", auto: false },
};
const LOOT_TABLE = ["pistol","smg","smg","shotgun","shotgun","rifle","rifle","sniper"];

// ---------- Deterministic-ish RNG (seedable) ----------
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
function pick(arr) { return arr[randInt(0, arr.length - 1)]; }
function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

// ---------- Game state ----------
let players = [], bullets = [], loot = [], particles = [], floatTexts = [];
let storm, player, startTime, running = false, alive = 0;
const cam = { x: 0, y: 0 };
const keys = {};
const mouse = { x: 0, y: 0, down: false };

const BOT_NAMES = ["Vortex","Nyx","Blaze","Echo","Riot","Sable","Comet","Frost","Dusk","Talon",
  "Ember","Onyx","Wren","Volt","Kilo","Zephyr","Rook","Mako","Cinder","Quill",
  "Drift","Hex","Lynx","Pyre","Slate"];

function spawnPlayer(isHuman, name) {
  const ang = rand(0, Math.PI * 2);
  const r = rand(200, WORLD * 0.42);
  return {
    isHuman, name,
    x: WORLD/2 + Math.cos(ang) * r,
    y: WORLD/2 + Math.sin(ang) * r,
    vx: 0, vy: 0, angle: 0,
    hp: 100, maxHp: 100, radius: 16,
    speed: isHuman ? 3.0 : rand(2.2, 2.8),
    weapon: isHuman ? "fists" : "fists",
    ammo: Infinity,
    lastShot: 0, alive: true, kills: 0,
    color: isHuman ? "#43e5ff" : "#" + ((1<<24)*(0.25+Math.random()*0.5)|0).toString(16).padStart(6,"0"),
    // bot AI
    target: null, wander: rand(0, Math.PI*2), wanderT: 0, reactionT: rand(150, 500),
    aggro: rand(0.4, 1),
  };
}

function spawnLoot() {
  loot = [];
  const n = 90;
  for (let i = 0; i < n; i++) {
    loot.push({
      x: rand(150, WORLD-150), y: rand(150, WORLD-150),
      type: pick(LOOT_TABLE), taken: false, bob: rand(0, Math.PI*2),
    });
  }
}

function initGame() {
  players = []; bullets = []; particles = []; floatTexts = [];
  player = spawnPlayer(true, "TOI");
  players.push(player);
  for (let i = 0; i < TOTAL_PLAYERS - 1; i++) players.push(spawnPlayer(false, BOT_NAMES[i % BOT_NAMES.length]));
  spawnLoot();
  alive = players.length;
  storm = {
    cx: WORLD/2, cy: WORLD/2,
    r: WORLD * 0.72,            // current safe radius
    targetR: WORLD * 0.72,
    nextX: WORLD/2, nextY: WORLD/2,
    phase: 0, shrinking: false, timer: 8, dmg: 0.25,
  };
  startTime = performance.now();
  running = true;
}

// ---------- Shooting ----------
function fire(p, now) {
  const w = WEAPONS[p.weapon];
  if (now - p.lastShot < w.rof) return;
  if (p.ammo <= 0) { if (p.weapon !== "fists") { p.weapon = "fists"; p.ammo = Infinity; } return; }
  p.lastShot = now;
  if (p.ammo !== Infinity) p.ammo -= 1;
  for (let i = 0; i < w.pellets; i++) {
    const a = p.angle + rand(-w.spread, w.spread);
    bullets.push({
      x: p.x + Math.cos(p.angle) * (p.radius + 6),
      y: p.y + Math.sin(p.angle) * (p.radius + 6),
      vx: Math.cos(a) * w.speed, vy: Math.sin(a) * w.speed,
      dmg: w.dmg, life: w.range / w.speed, owner: p, color: w.color,
    });
  }
  // muzzle flash
  for (let i = 0; i < 4; i++)
    particles.push({ x: p.x + Math.cos(p.angle)*p.radius, y: p.y + Math.sin(p.angle)*p.radius,
      vx: Math.cos(p.angle)*rand(2,5)+rand(-1,1), vy: Math.sin(p.angle)*rand(2,5)+rand(-1,1),
      life: 8, color: w.color, r: rand(2,4) });
  // recoil
  p.vx -= Math.cos(p.angle) * 0.6; p.vy -= Math.sin(p.angle) * 0.6;
}

function damage(target, amount, from) {
  target.hp -= amount;
  for (let i = 0; i < 6; i++)
    particles.push({ x: target.x, y: target.y, vx: rand(-3,3), vy: rand(-3,3), life: rand(8,16), color: "#ff5d6c", r: rand(1.5,3.5) });
  if (target.hp <= 0 && target.alive) {
    target.alive = false; alive--;
    if (from) { from.kills++; if (from.isHuman) addFloat(target.x, target.y, "ÉLIMINÉ", "#5dffa0"); }
    // drop their weapon
    if (target.weapon !== "fists")
      loot.push({ x: target.x, y: target.y, type: target.weapon, taken: false, bob: 0 });
    for (let i = 0; i < 20; i++)
      particles.push({ x: target.x, y: target.y, vx: rand(-5,5), vy: rand(-5,5), life: rand(15,30), color: target.color, r: rand(2,5) });
    checkEnd();
  }
}
function addFloat(x, y, txt, color) { floatTexts.push({ x, y, txt, color, life: 60 }); }

// ---------- Bot AI ----------
function updateBot(p, now, dt) {
  // find nearest alive enemy within sight
  let best = null, bd = 700;
  for (const o of players) {
    if (o === p || !o.alive) continue;
    const d = dist(p.x, p.y, o.x, o.y);
    if (d < bd) { bd = d; best = o; }
  }
  const outsideStorm = dist(p.x, p.y, storm.cx, storm.cy) > storm.r - 40;
  let mx = 0, my = 0;
  if (outsideStorm) {
    // run to safe zone center
    const a = Math.atan2(storm.cy - p.y, storm.cx - p.x);
    mx = Math.cos(a); my = Math.sin(a); p.angle = a;
  } else if (best) {
    p.target = best;
    p.angle = Math.atan2(best.y - p.y, best.x - p.x) + rand(-0.05, 0.05);
    // strafe / keep distance
    const ideal = 320;
    const a = Math.atan2(best.y - p.y, best.x - p.x);
    if (bd > ideal + 60) { mx = Math.cos(a); my = Math.sin(a); }
    else if (bd < ideal - 60) { mx = -Math.cos(a); my = -Math.sin(a); }
    else { mx = Math.cos(a + Math.PI/2); my = Math.sin(a + Math.PI/2); }
    if (Math.random() < 0.6 * p.aggro) fire(p, now);
  } else {
    // wander, seek loot if unarmed
    p.wanderT -= dt;
    if (p.weapon === "fists") {
      let nl = null, nd = 900;
      for (const l of loot) { if (l.taken) continue; const d = dist(p.x,p.y,l.x,l.y); if (d<nd){nd=d;nl=l;} }
      if (nl) { const a = Math.atan2(nl.y-p.y, nl.x-p.x); mx=Math.cos(a); my=Math.sin(a); p.angle=a; }
    }
    if (mx === 0 && my === 0) {
      if (p.wanderT <= 0) { p.wander = rand(0, Math.PI*2); p.wanderT = rand(500, 1400); }
      mx = Math.cos(p.wander); my = Math.sin(p.wander); p.angle = p.wander;
    }
  }
  p.vx += mx * p.speed * 0.2; p.vy += my * p.speed * 0.2;
}

// ---------- Storm ----------
function updateStorm(dt) {
  storm.timer -= dt / 1000;
  if (storm.timer <= 0) {
    if (!storm.shrinking && storm.phase < 7) {
      // pick next center inside current circle, plan shrink
      const ang = rand(0, Math.PI*2), rr = storm.r * 0.45;
      storm.nextX = clamp(storm.cx + Math.cos(ang)*rr, storm.r*0.4, WORLD-storm.r*0.4);
      storm.nextY = clamp(storm.cy + Math.sin(ang)*rr, storm.r*0.4, WORLD-storm.r*0.4);
      storm.targetR = Math.max(220, storm.r * 0.58);
      storm.shrinking = true; storm.timer = 6; storm.dmg += 0.18;
    } else if (storm.shrinking) {
      storm.shrinking = false; storm.phase++; storm.timer = 9;
    } else { storm.timer = 9; }
  }
  if (storm.shrinking) {
    const k = 1 - storm.timer / 6;
    storm.r += (storm.targetR - storm.r) * 0.02;
    storm.cx += (storm.nextX - storm.cx) * 0.02;
    storm.cy += (storm.nextY - storm.cy) * 0.02;
  }
}

// ---------- Update ----------
let lastT = performance.now();
function update(now) {
  const dt = Math.min(40, now - lastT); lastT = now;
  if (!running) return;

  updateStorm(dt);

  // player input
  if (player.alive) {
    let mx = 0, my = 0;
    if (keys["w"]||keys["z"]||keys["arrowup"]) my -= 1;
    if (keys["s"]||keys["arrowdown"]) my += 1;
    if (keys["a"]||keys["q"]||keys["arrowleft"]) mx -= 1;
    if (keys["d"]||keys["arrowright"]) mx += 1;
    const len = Math.hypot(mx, my) || 1;
    player.vx += (mx/len) * player.speed * 0.35;
    player.vy += (my/len) * player.speed * 0.35;
    player.angle = Math.atan2(mouse.y + cam.y - player.y, mouse.x + cam.x - player.x);
    const w = WEAPONS[player.weapon];
    if ((mouse.down || keys[" "])) {
      if (w.auto || now - player.lastShot >= w.rof) fire(player, now);
    }
  }

  // entities
  for (const p of players) {
    if (!p.alive) continue;
    if (!p.isHuman) updateBot(p, now, dt);
    p.x += p.vx; p.y += p.vy; p.vx *= 0.82; p.vy *= 0.82;
    p.x = clamp(p.x, 0, WORLD); p.y = clamp(p.y, 0, WORLD);
    // storm damage
    if (dist(p.x, p.y, storm.cx, storm.cy) > storm.r) {
      p.hp -= storm.dmg * (dt/16);
      if (p.hp <= 0 && p.alive) damage(p, 0.01, null);
    }
    // loot pickup
    for (const l of loot) {
      if (l.taken) continue;
      if (dist(p.x, p.y, l.x, l.y) < p.radius + 14) {
        l.taken = true;
        const w = WEAPONS[l.type];
        // keep better-or-new; refill ammo
        p.weapon = l.type; p.ammo = w.ammo;
        if (p.isHuman) addFloat(p.x, p.y, w.name.toUpperCase(), w.color);
      }
    }
  }

  // bullets
  for (const b of bullets) {
    b.x += b.vx; b.y += b.vy; b.life--;
    for (const p of players) {
      if (!p.alive || p === b.owner) continue;
      if (dist(b.x, b.y, p.x, p.y) < p.radius) {
        damage(p, b.dmg, b.owner); b.life = 0; break;
      }
    }
  }
  bullets = bullets.filter(b => b.life > 0 && b.x>0 && b.y>0 && b.x<WORLD && b.y<WORLD);

  // particles & floats
  for (const pa of particles) { pa.x += pa.vx; pa.y += pa.vy; pa.vx*=0.92; pa.vy*=0.92; pa.life--; }
  particles = particles.filter(p => p.life > 0);
  for (const f of floatTexts) { f.y -= 0.6; f.life--; }
  floatTexts = floatTexts.filter(f => f.life > 0);

  // camera follow
  cam.x += (player.x - W/2 - cam.x) * 0.12;
  cam.y += (player.y - H/2 - cam.y) * 0.12;
}

function checkEnd() {
  const aliveList = players.filter(p => p.alive);
  if (!player.alive || aliveList.length <= 1) {
    if (player.alive && aliveList.length <= 1) endGame(true);
    else if (!player.alive) endGame(false);
  }
}

// ---------- Render ----------
function draw() {
  if (!storm || !player) return;   // not initialized yet (start screen)
  ctx.fillStyle = "#0c1118"; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(-cam.x, -cam.y);

  // ground grid
  ctx.strokeStyle = "rgba(60,90,130,.12)"; ctx.lineWidth = 1;
  const g = 200;
  const x0 = Math.max(0, Math.floor(cam.x/g)*g), x1 = Math.min(WORLD, cam.x+W);
  const y0 = Math.max(0, Math.floor(cam.y/g)*g), y1 = Math.min(WORLD, cam.y+H);
  ctx.beginPath();
  for (let x=x0; x<=x1; x+=g){ ctx.moveTo(x,y0); ctx.lineTo(x,y1); }
  for (let y=y0; y<=y1; y+=g){ ctx.moveTo(x0,y); ctx.lineTo(x1,y); }
  ctx.stroke();
  // world border
  ctx.strokeStyle = "rgba(120,160,220,.3)"; ctx.lineWidth = 6; ctx.strokeRect(0,0,WORLD,WORLD);

  // loot
  for (const l of loot) {
    if (l.taken) continue;
    l.bob += 0.05;
    const w = WEAPONS[l.type], bob = Math.sin(l.bob)*3;
    ctx.save(); ctx.translate(l.x, l.y + bob);
    ctx.fillStyle = "rgba(10,16,24,.85)"; ctx.strokeStyle = w.color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(-13,-11,26,22,5); ctx.fill(); ctx.stroke();
    ctx.fillStyle = w.color; ctx.fillRect(-8,-2,16,4);
    ctx.restore();
  }

  // particles (under players)
  for (const pa of particles) {
    ctx.globalAlpha = Math.max(0, pa.life/30); ctx.fillStyle = pa.color;
    ctx.beginPath(); ctx.arc(pa.x, pa.y, pa.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // players
  for (const p of players) {
    if (!p.alive) continue;
    // gun
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle);
    ctx.fillStyle = "#2b3340"; ctx.fillRect(p.radius-2, -3, 18, 6);
    ctx.fillStyle = WEAPONS[p.weapon].color; ctx.fillRect(p.radius+10, -2, 6, 4);
    ctx.restore();
    // body
    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, 7);
    ctx.fillStyle = p.color; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = p.isHuman ? "#fff" : "rgba(0,0,0,.4)"; ctx.stroke();
    // hp bar
    const bw = 34;
    ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(p.x-bw/2, p.y-p.radius-12, bw, 5);
    ctx.fillStyle = p.hp>50?"#5dffa0":p.hp>25?"#ffd36b":"#ff5d6c";
    ctx.fillRect(p.x-bw/2, p.y-p.radius-12, bw*clamp(p.hp/p.maxHp,0,1), 5);
    if (!p.isHuman) { ctx.fillStyle="rgba(200,220,255,.55)"; ctx.font="11px Trebuchet MS";
      ctx.textAlign="center"; ctx.fillText(p.name, p.x, p.y-p.radius-16); }
  }

  // bullets
  for (const b of bullets) {
    ctx.strokeStyle = b.color; ctx.lineWidth = 3; ctx.beginPath();
    ctx.moveTo(b.x, b.y); ctx.lineTo(b.x-b.vx*1.5, b.y-b.vy*1.5); ctx.stroke();
  }

  // float texts
  for (const f of floatTexts) {
    ctx.globalAlpha = clamp(f.life/60,0,1); ctx.fillStyle = f.color;
    ctx.font = "900 16px Trebuchet MS"; ctx.textAlign = "center";
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // storm (draw darkened area outside safe circle)
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,WORLD,WORLD);
  ctx.arc(storm.cx, storm.cy, storm.r, 0, 7, true);
  ctx.fillStyle = "rgba(120,40,200,.28)"; ctx.fill("evenodd");
  ctx.beginPath(); ctx.arc(storm.cx, storm.cy, storm.r, 0, 7);
  ctx.strokeStyle = storm.shrinking ? "#ff6bd6" : "#9b6bff"; ctx.lineWidth = 5; ctx.stroke();
  ctx.restore();

  ctx.restore(); // end world transform
  drawHUD();
}

function drawHUD() {
  // health bar
  const bx = 24, by = H-70, bw = 320, bh = 24;
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(bx-4, by-4, bw+8, bh+8);
  ctx.fillStyle = "#1a2230"; ctx.fillRect(bx, by, bw, bh);
  const hp = clamp(player.hp/player.maxHp,0,1);
  ctx.fillStyle = hp>0.5?"#5dffa0":hp>0.25?"#ffd36b":"#ff5d6c";
  ctx.fillRect(bx, by, bw*hp, bh);
  ctx.fillStyle="#fff"; ctx.font="bold 15px Trebuchet MS"; ctx.textAlign="left";
  ctx.fillText("PV " + Math.max(0,Math.ceil(player.hp)), bx+8, by+17);

  // weapon + ammo
  const w = WEAPONS[player.weapon];
  ctx.textAlign="left"; ctx.font="900 22px Trebuchet MS"; ctx.fillStyle=w.color;
  ctx.fillText(w.name.toUpperCase(), bx, by-16);
  ctx.font="bold 16px Trebuchet MS"; ctx.fillStyle="#cfe0f7";
  ctx.fillText(player.ammo===Infinity? "∞" : "Munitions : "+player.ammo, bx+ (w.name.length*13+20), by-16);

  // top: alive + kills + timer
  ctx.textAlign="right"; ctx.font="900 30px Trebuchet MS"; ctx.fillStyle="#fff";
  ctx.fillText(alive + " EN VIE", W-24, 44);
  ctx.font="bold 18px Trebuchet MS"; ctx.fillStyle="#5dffa0";
  ctx.fillText("Éliminations : " + player.kills, W-24, 72);
  const t = Math.floor((performance.now()-startTime)/1000);
  ctx.fillStyle="#9fb3d1"; ctx.fillText("⏱ " + t + "s", W-24, 96);
  // storm warning
  if (storm.shrinking) { ctx.textAlign="center"; ctx.font="900 20px Trebuchet MS";
    ctx.fillStyle="#ff6bd6"; ctx.fillText("⚠ LA TEMPÊTE SE REFERME", W/2, 40); }

  // minimap
  const ms = 150, mx = W-ms-20, my = H-ms-20, sc = ms/WORLD;
  ctx.fillStyle="rgba(8,12,20,.8)"; ctx.fillRect(mx,my,ms,ms);
  ctx.strokeStyle="rgba(120,160,220,.4)"; ctx.lineWidth=2; ctx.strokeRect(mx,my,ms,ms);
  // storm on minimap
  ctx.beginPath(); ctx.arc(mx+storm.cx*sc, my+storm.cy*sc, storm.r*sc, 0, 7);
  ctx.strokeStyle="#9b6bff"; ctx.lineWidth=1.5; ctx.stroke();
  for (const p of players) { if(!p.alive) continue;
    ctx.fillStyle = p.isHuman ? "#43e5ff" : "#ff5d6c";
    ctx.fillRect(mx+p.x*sc-1.5, my+p.y*sc-1.5, p.isHuman?4:3, p.isHuman?4:3); }
}

// ---------- Loop ----------
function loop(now) { update(now); draw(); requestAnimationFrame(loop); }

// ---------- End ----------
function endGame(won) {
  running = false;
  const rank = won ? 1 : players.filter(p=>p.alive).length + 1;
  document.getElementById("endTitle").textContent = won ? "VICTOIRE ROYALE !" : "ÉLIMINÉ";
  document.getElementById("endTitle").className = won ? "win" : "lose";
  document.getElementById("endKills").textContent = player.kills;
  document.getElementById("endRank").textContent = "#" + rank;
  document.getElementById("endTime").textContent = Math.floor((performance.now()-startTime)/1000) + "s";
  document.getElementById("endScreen").classList.remove("hidden");
}

// ---------- Input ----------
addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; if(e.key===" ") e.preventDefault(); });
addEventListener("keyup",   e => { keys[e.key.toLowerCase()] = false; });
cv.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
cv.addEventListener("mousedown", () => mouse.down = true);
addEventListener("mouseup",   () => mouse.down = false);
cv.addEventListener("contextmenu", e => e.preventDefault());

document.getElementById("startBtn").onclick = () => {
  document.getElementById("startScreen").classList.add("hidden");
  initGame();
};
document.getElementById("restartBtn").onclick = () => {
  document.getElementById("endScreen").classList.add("hidden");
  initGame();
};

requestAnimationFrame(loop);
</script>
</body>
</html>
